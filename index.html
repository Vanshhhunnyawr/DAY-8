<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Sky Journey</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- GLOBAL & RESETS --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            font-family: 'Montserrat', sans-serif;
            background-color: #05020a; /* Dark void for the final reveal */
        }

        /* --- THE SPLIT SKY BACKGROUND --- */
        .sky-door {
            position: fixed;
            top: 0;
            width: 50vw;
            height: 100vh;
            background: linear-gradient(to bottom, #74ebd5 0%, #ffc4e1 100%);
            z-index: 5;
            transition: transform 2s cubic-bezier(0.77, 0, 0.175, 1);
            will-change: transform;
        }

        .sky-door.left {
            left: 0;
            border-right: 1px solid rgba(255,255,255,0.2);
        }

        .sky-door.right {
            right: 0;
            border-left: 1px solid rgba(255,255,255,0.2);
        }

        .sky-door.split-left { transform: translateX(-100%); }
        .sky-door.split-right { transform: translateX(100%); }

        /* --- THE SCROLLABLE FOREGROUND --- */
        .scroll-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            min-height: 200vh; /* Forces scrolling */
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: opacity 1s ease;
        }

        .scroll-layer.hide {
            opacity: 0;
            pointer-events: none;
        }

        /* --- CLOUDS --- */
        .clouds-container {
            position: absolute;
            top: 0;
            width: 100%;
            height: 200px;
            background: url('https://www.transparenttextures.com/patterns/stardust.png');
            z-index: 12;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow: hidden;
        }

        .cloud {
            width: 300px;
            height: 100px;
            background: #ffffff;
            border-radius: 100px;
            position: absolute;
            top: -20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            filter: blur(4px);
        }

        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
        }

        .cloud::before { width: 150px; height: 150px; top: -70px; left: 40px; }
        .cloud::after { width: 100px; height: 100px; top: -40px; right: 40px; }

        .cloud:nth-child(1) { left: -50px; transform: scale(1.2); opacity: 0.9; }
        .cloud:nth-child(2) { right: -50px; transform: scale(1.3); opacity: 0.8; }
        .cloud:nth-child(3) { left: 50%; transform: translateX(-50%) scale(1.5); top: -40px; z-index: 13; }

        /* --- FALLING RIBBON --- */
        .ribbon-wrapper {
            position: relative;
            top: 100px; /* Starts just under clouds */
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 11;
        }

        .ribbon {
            width: 25px;
            background: linear-gradient(to bottom, #ff7fa5, #ff4d85);
            box-shadow: 0 0 20px rgba(255, 127, 165, 0.6);
            border-radius: 0 0 15px 15px;
            /* Animation starts at 0 height and grows */
            height: 0;
            animation: unrollRibbon 3.5s cubic-bezier(0.25, 1, 0.5, 1) forwards 0.5s;
        }

        @keyframes unrollRibbon {
            0% { height: 0; }
            100% { height: 1200px; } /* The length of the ribbon */
        }

        /* --- FALLING PHOTOS --- */
        .photos-grid {
            position: absolute;
            top: 1200px; /* Exactly at the end of the 1200px ribbon */
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding-top: 10px;
            /* Start hidden above the screen */
            transform: translateY(-1500px);
            opacity: 0;
            animation: dropPhotos 2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards 4s; /* Starts after ribbon unrolls */
        }

        @keyframes dropPhotos {
            0% { transform: translateY(-1500px); opacity: 1; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .photo-card {
            width: 140px;
            height: 180px;
            background: rgba(255,255,255,0.9);
            padding: 8px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            transform-origin: center top;
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 6px;
        }

        /* Add a little tilt to the photos for realism */
        .photo-card:nth-child(1) { transform: rotate(-5deg); }
        .photo-card:nth-child(2) { transform: rotate(4deg); }
        .photo-card:nth-child(3) { transform: rotate(3deg); }
        .photo-card:nth-child(4) { transform: rotate(-4deg); }

        /* --- THE BUTTON --- */
        .button-container {
            margin-top: 1550px; /* Pushed below the ribbon and photos */
            padding-bottom: 100px;
        }

        .open-sky-btn {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            padding: 20px 50px;
            color: #ff4d85;
            background: #ffffff;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 15px 30px rgba(255, 77, 133, 0.3), 0 0 0 4px rgba(255,255,255,0.5);
            transition: all 0.3s ease;
            animation: pulseBtn 2s infinite alternate;
        }

        .open-sky-btn:hover {
            transform: scale(1.05) translateY(-5px);
            box-shadow: 0 20px 40px rgba(255, 77, 133, 0.5), 0 0 0 6px rgba(255,255,255,0.8);
        }

        @keyframes pulseBtn {
            0% { box-shadow: 0 15px 30px rgba(255, 77, 133, 0.3), 0 0 0 4px rgba(255,255,255,0.3); }
            100% { box-shadow: 0 20px 40px rgba(255, 77, 133, 0.6), 0 0 0 8px rgba(255,255,255,0.6); }
        }

        /* --- THE GRAND FINALE REVEAL --- */
        .finale-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1; /* Sits behind the sky doors */
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #2a0835 0%, #05020a 100%);
        }

        /* Ambient Glowing Particles in the background */
        .finale-layer::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: radial-gradient(#ff7fa5 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: 0.1;
            animation: slowSpin 100s linear infinite;
        }

        @keyframes slowSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .romantic-text {
            width: 90%;
            max-width: 800px;
            text-align: center;
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem;
            line-height: 1.4;
            color: #ffffff;
            background: linear-gradient(135deg, #ffffff 0%, #ffb7ce 50%, #ff7fa5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(255, 127, 165, 0.5));
            
            /* Hidden Initially */
            opacity: 0;
            transform: scale(0.5) translateY(50px);
            transition: all 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2;
        }

        .romantic-text.show {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        /* --- RESPONSIVE ADJUSTMENTS --- */
        @media (max-width: 600px) {
            .photos-grid { gap: 10px; }
            .photo-card { width: 130px; height: 160px; }
            .romantic-text { font-size: 2.2rem; }
            .open-sky-btn { padding: 15px 35px; font-size: 1rem; }
        }
    </style>
</head>
<body>

    <!-- THE BACKGROUND REVEAL (Layer 1 - Bottom) -->
    <div class="finale-layer">
        <div class="romantic-text" id="finalText">
            I LOVEE YOUU SOOO MUCHHH RUBUUUUU ALOTTTTT I WANNA BE WITH YOU MY WHOLE LIFEEEE HEHEHE
        </div>
    </div>

    <!-- THE SPLIT SKY DOORS (Layer 2 - Middle) -->
    <div class="sky-door left" id="doorLeft"></div>
    <div class="sky-door right" id="doorRight"></div>

    <!-- THE SCROLLABLE ELEMENTS (Layer 3 - Top) -->
    <div class="scroll-layer" id="scrollLayer">
        
        <!-- Fluffy Clouds -->
        <div class="clouds-container">
            <div class="cloud"></div>
            <div class="cloud"></div>
            <div class="cloud"></div>
        </div>

        <!-- The Falling Ribbon -->
        <div class="ribbon-wrapper">
            <div class="ribbon"></div>
            
            <!-- The Photos that lock at the end -->
            <div class="photos-grid">
                <div class="photo-card"><img src="her1.jpeg" alt="Photo 1" onerror="this.src='https://picsum.photos/200/300?random=1'"></div>
                <div class="photo-card"><img src="her2.jpg" alt="Photo 2" onerror="this.src='https://picsum.photos/200/300?random=2'"></div>
                <div class="photo-card"><img src="her3.jpg" alt="Photo 3" onerror="this.src='https://picsum.photos/200/300?random=3'"></div>
                <div class="photo-card"><img src="her4.jpg" alt="Photo 4" onerror="this.src='https://picsum.photos/200/300?random=4'"></div>
            </div>
        </div>

        <!-- The Button at the bottom of the page -->
        <div class="button-container">
            <button class="open-sky-btn" id="openSkyBtn">Open Sky</button>
        </div>

    </div>

    <!-- ANIMATION LOGIC -->
    <script>
        document.getElementById('openSkyBtn').addEventListener('click', function() {
            
            // 1. Lock the scroll position so it doesn't jump weirdly during the animation
            document.body.style.overflow = 'hidden';
            
            // 2. Smoothly fade out the ribbon, photos, clouds, and button
            const scrollLayer = document.getElementById('scrollLayer');
            scrollLayer.classList.add('hide');

            // 3. Wait for the fade out (1 second), then split the sky!
            setTimeout(() => {
                // Scroll page back to top instantly behind the scenes for a centered text reveal
                window.scrollTo(0, 0);

                document.getElementById('doorLeft').classList.add('split-left');
                document.getElementById('doorRight').classList.add('split-right');
                
                // 4. Wait for the sky to open slightly, then pop up the text
                setTimeout(() => {
                    document.getElementById('finalText').classList.add('show');
                }, 800); // Trigger text slightly before doors finish opening

            }, 1000); 
        });
    </script>

</body>
</html>
